# Ebury data pipeline — local stack.
#
# Config uses ${VAR:-default} so `docker compose up` runs with NO .env file (ADR 0002).
# Defaults are throwaway local values; production would source secrets from a manager.
#
# Services (started by `up`): warehouse, airflow-meta, airflow-init, airflow-webserver,
# airflow-scheduler. The `dbt` service is on-demand (profile "tools") — dbt is an
# execution engine invoked per-run, not a long-running daemon.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: ebury/airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_META_PASSWORD:-airflow}@airflow-meta:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-only-secret-key}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Warehouse connection — dbt's profiles.yml reads these env vars.
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: ${WAREHOUSE_DB:-ebury}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-ebury}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-ebury}
    DBT_PROFILES_DIR: /opt/airflow/dbt/ebury
    DBT_PROJECT_DIR: /opt/airflow/dbt/ebury
    # Warehouse Airflow Connection (used by PostgresHook) — injected, no manual UI step.
    AIRFLOW_CONN_WAREHOUSE: postgres://${WAREHOUSE_USER:-ebury}:${WAREHOUSE_PASSWORD:-ebury}@warehouse:5432/${WAREHOUSE_DB:-ebury}
  volumes:
    - ./dags:/opt/airflow/dags
    # dbt: mount only the editable subdirs/files so the image's baked dbt_packages/
    # (from `dbt deps`) is preserved and not shadowed by the host mount.
    - ./dbt/ebury/models:/opt/airflow/dbt/ebury/models
    - ./dbt/ebury/macros:/opt/airflow/dbt/ebury/macros
    - ./dbt/ebury/tests:/opt/airflow/dbt/ebury/tests
    - ./dbt/ebury/dbt_project.yml:/opt/airflow/dbt/ebury/dbt_project.yml
    - ./dbt/ebury/profiles.yml:/opt/airflow/dbt/ebury/profiles.yml
    - ./dbt/ebury/packages.yml:/opt/airflow/dbt/ebury/packages.yml
    - ./include:/opt/airflow/include
    - ./tests:/opt/airflow/tests
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ---- Data warehouse (raw + analytics schemas) ----
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-ebury}
      POSTGRES_USER: ${WAREHOUSE_USER:-ebury}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-ebury}
    ports:
      - "${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-ebury} -d ${WAREHOUSE_DB:-ebury}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Airflow metadata DB (separate from the warehouse, on purpose) ----
  airflow-meta:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_META_PASSWORD:-airflow}
    volumes:
      - airflow-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- One-shot init: migrate metadata DB + create admin user ----
  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-meta:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
        echo "airflow-init complete"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      airflow-meta:
        condition: service_healthy
      warehouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      airflow-meta:
        condition: service_healthy
      warehouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- On-demand dbt (not started by `up`). Usage:
  #   docker compose run --rm dbt debug
  dbt:
    <<: *airflow-common
    profiles: ["tools"]
    entrypoint: ["/opt/dbt-venv/bin/dbt"]
    command: ["debug"]
    working_dir: /opt/airflow/dbt/ebury
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse-data:
  airflow-meta-data:
  airflow-logs:

# dbt connection profile. Values come from environment variables (set in
# docker-compose.yml), so no secrets live in this file. Defaults match the
# local warehouse service.
ebury:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'warehouse') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('WAREHOUSE_USER', 'ebury') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'ebury') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'ebury') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
